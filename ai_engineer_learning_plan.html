let activePhase = 0;
let activeWeek = 0;
const openDays = new Set();

function renderPhaseTabs() {
  const el = document.getElementById('phaseTabs');
  el.innerHTML = plan.phases.map((p,i) => `
    <button class="phase-tab${i===activePhase?' active':''}" onclick="setPhase(${i})">
      阶段${p.id}：${p.duration}
    </button>
  `).join('');
}

function renderPhaseContent() {
  const phase = plan.phases[activePhase];
  const el = document.getElementById('phaseContent');
  el.innerHTML = `
    <div class="phase-header">
      <div class="phase-meta">
        <div class="phase-title">${phase.title}</div>
        <div class="phase-desc">${phase.desc}</div>
      </div>
      <div class="phase-badge">共 ${phase.duration}</div>
    </div>
    <div class="week-tabs" id="weekTabs">${phase.weeks.map((w,i)=>`
      <button class="week-tab${i===activeWeek?' active':''}" onclick="setWeek(${i})">${w.title.split('：')[0]}</button>
    `).join('')}</div>
    <div class="week-title">${phase.weeks[activeWeek].title}</div>
    <div class="day-grid">${renderDays(phase.weeks[activeWeek].days)}</div>
    ${renderProject(phase.project)}
  `;
}

function renderDays(days) {
  return days.map((d,i) => {
    const key = `${activePhase}-${activeWeek}-${i}`;
    const isOpen = openDays.has(key);
    return `
      <div class="day-card">
        <div class="day-header" onclick="toggleDay('${key}')">
          <span class="day-label">${d.label}</span>
          <span class="day-summary">${d.summary}</span>
          <i class="ti ti-chevron-down day-chevron${isOpen?' open':''}" aria-hidden="true"></i>
        </div>
        <div class="day-body${isOpen?' open':''}">
          <div class="col-block">
            <div class="col-title"><i class="ti ti-book" aria-hidden="true"></i>理论学习</div>
            <div class="col-content">${d.theory}</div>
          </div>
          <div class="col-block">
            <div class="col-title"><i class="ti ti-code" aria-hidden="true"></i>编码实践</div>
            <div class="col-content">${d.practice}</div>
          </div>
          <div class="col-block">
            <div class="col-title"><i class="ti ti-link" aria-hidden="true"></i>学习资源</div>
            <ul class="resources-list">
              ${d.resources.map(r=>`<li><a href="${r.url}" target="_blank" rel="noopener">${r.text}</a></li>`).join('')}
            </ul>
          </div>
          <div class="col-block">
            <div class="col-title"><i class="ti ti-pencil" aria-hidden="true"></i>总结反思</div>
            <div class="col-content" style="color:var(--color-text-secondary)">${d.reflection}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderProject(p) {
  return `
    <div class="project-section" style="margin-top:1.5rem">
      <div class="project-header">
        <span class="project-badge">阶段项目</span>
        <span class="project-title">${p.title}</span>
      </div>
      <div class="project-body">
        <div class="project-col">
          <h4>技术栈</h4>
          <div>${p.stack.map(t=>`<span class="tech-tag">${t}</span>`).join('')}</div>
        </div>
        <div class="project-col">
          <h4>项目目标</h4>
          <ul>${p.goals.map(g=>`<li>${g}</li>`).join('')}</ul>
        </div>
        <div class="project-col">
          <h4>开发步骤</h4>
          <ul>${p.steps.map(s=>`<li>${s}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
  `;
}

function setPhase(i) {
  activePhase = i;
  activeWeek = 0;
  openDays.clear();
  renderPhaseTabs();
  renderPhaseContent();
}

function setWeek(i) {
  activeWeek = i;
  openDays.clear();
  renderPhaseContent();
}

function toggleDay(key) {
  if(openDays.has(key)) openDays.delete(key);
  else openDays.add(key);
  renderPhaseContent();
}

renderPhaseTabs();
renderPhaseContent();
